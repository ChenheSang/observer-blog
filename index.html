<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Observer | 云端博客</title>
</head>
<body style="background:#fff;color:#111;font-family:sans-serif;padding:2rem">
<h1>Observer</h1>
<div id="app">加载中...</div>
<script>
document.getElementById('app').textContent = 'JS 执行成功！';
fetch('articles.json?v=' + Date.now())
  .then(r => r.json())
  .then(d => {
    const list = (d.articles || []);
    document.getElementById('app').innerHTML =
      '<p>共 ' + list.length + ' 篇文章</p>' +
      list.map(a => '<h2>' + a.title + '</h2><p>' + a.content + '</p>').join('');
  })
  .catch(err => {
    document.getElementById('app').innerHTML = '加载失败：' + err.message;
  });
</script>
</body>
</html>
